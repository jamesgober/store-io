name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    # Windows on 1.85 has taken 15 to 30 minutes (three test passes; the
    # crash enumerations' 2 to 5 minutes vary with the runner): 30 cut one
    # short with every test passing.
    timeout-minutes: 45
    # rust-toolchain.toml pins `stable` for local dev; this overrides it per-job
    # so the matrix exercises both stable and the 1.85 MSRV.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The Linux backend tests run on the runner's own filesystem; record its
      # kernel and mount options so every result can be read against them.
      - name: Storage facts (Linux)
        if: runner.os == 'Linux'
        run: |
          uname -r
          findmnt -no SOURCE,FSTYPE,OPTIONS --target "$HOME"
          for f in /proc/fs/ext4/*/options; do echo "== $f"; paste -sd, "$f"; done
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (all features)
        run: cargo test --workspace --all-features
      # The simulator's queues perform at once (the fast path Linux's
      # synchronous tier takes, G1 P1): the simulator's suites once more.
      - name: Test (simulator inline)
        run: cargo test -p store-io-engine -p store-io-sim -p store-io
        env:
          STORE_IO_SIM_INLINE: "1"
      # Linux's idle check runs in conformance-linux, on both tiers.
      - name: Idle store is silent (60 s)
        if: runner.os != 'Linux' && matrix.rust == 'stable'
        run: cargo test --test idle -- --ignored --test-threads=1 --nocapture
      # 512 MiB of writes in flight at each of four kills: once, on stable.
      - name: Killed owner's lock waits for its writes
        if: runner.os == 'Windows' && matrix.rust == 'stable'
        timeout-minutes: 10
        run: cargo test -p store-io-win --test kill -- --ignored --nocapture
      - name: Doc (all features)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Exhaustive interleaving checks of the lock-free code: the buffer pool's
  # free lists, the append frontier, the flush domain and the region gate;
  # and of the Linux submit pool's job queue and inbox handoffs.
  loom:
    name: Loom (model checking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "--cfg loom"
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: Loom models
        run: cargo test -p store-io-buf -p store-io-engine -p store-io-posix --lib --release loom

  # Undefined-behaviour checks of the unsafe buffer code (arena, pool,
  # lock-free queue, secure wipe) under Miri.
  miri:
    name: Miri (buffers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # rust-toolchain.toml pins stable for local work; Miri needs nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri
        run: cargo miri test -p store-io-buf
      - name: Miri (io_uring ring indices, simulated kernel)
        run: cargo miri test -p store-io-posix --lib uring::sys::fake

  # The conformance suite and the end-to-end tests on real Linux file
  # systems with barriers on. The runner's own root is mounted `nobarrier`
  # (store-io classes it unsafe), so each file system is a loop-mounted
  # image. The image's backing file still lives on that root, so these runs
  # check behaviour, not power-loss durability.
  conformance-linux:
    name: Conformance (${{ matrix.fs }} image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, xfs]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mount a ${{ matrix.fs }} image
        run: |
          if [ "${{ matrix.fs }}" = xfs ]; then bash dev/tools/apt-install.sh xfsprogs; fi
          truncate -s 4G "$RUNNER_TEMP/fs.img"
          sudo mkfs.${{ matrix.fs }} -q "$RUNNER_TEMP/fs.img"
          sudo mkdir -p /mnt/sio
          sudo mount -o loop "$RUNNER_TEMP/fs.img" /mnt/sio
          sudo chown "$(id -u):$(id -g)" /mnt/sio
          findmnt -no SOURCE,FSTYPE,OPTIONS /mnt/sio
      - name: Conformance and end-to-end tests
        run: cargo test --test conformance --test native -- --nocapture
        env:
          STORE_IO_TEST_DIR: /mnt/sio
          STORE_IO_EXPECT_URING: "1"
      # R5.13: every paced call completes with its pieces really in flight
      # (the simulator's inline queue has none), paced, unpaced and across
      # the switch, each under a watchdog.
      - name: Progress on a parallel io_uring queue
        run: cargo test --test progress_uring -- --nocapture
        env:
          STORE_IO_TEST_DIR: /mnt/sio
          STORE_IO_EXPECT_URING: "1"
      # v0.4 exit criteria on this kernel and file system: an idle store is
      # silent (60 s, both tiers), and nothing runs on io_uring's io-wq
      # workers (fails closed: a positive control must see them, and every
      # store-io point must run on io_uring), with fallbacks counted.
      - name: Idle store is silent (60 s per tier)
        run: |
          uname -r; findmnt -no FSTYPE /mnt/sio
          cargo test --test idle -- --ignored --test-threads=1 --nocapture
        env:
          STORE_IO_TEST_DIR: /mnt/sio
          STORE_IO_EXPECT_URING: "1"
      - name: No io-wq workers (W6 on io_uring), fallbacks counted
        run: |
          bash dev/tools/apt-install.sh --update fio
          (cd harness && cargo build --release)
          echo "kernel $(uname -r), fs $(findmnt -no FSTYPE /mnt/sio)"
          bash dev/tools/iowq-gate.sh
        env:
          STORE_IO_TEST_DIR: /mnt/sio
      - name: Hot path makes no futex call and no timed wait (strace)
        run: |
          bash dev/tools/apt-install.sh strace
          cargo test --test hotpath --no-run
          strace -f -qq -o "$RUNNER_TEMP/hot.trace" \
            -e 'trace=/^futex,nanosleep,clock_nanosleep,timerfd_create,timerfd_settime,setitimer,statx,newfstatat,io_uring_enter' \
            cargo test --test hotpath -- --ignored --exact hotpath_window
          python3 dev/tools/hotpath-check.py "$RUNNER_TEMP/hot.trace"
        env:
          STORE_IO_TEST_DIR: /mnt/sio

  # The CI kernel matrix (v0.4): conformance, the end-to-end tests and the
  # Linux backend's tests on older kernels, each booted in a virtme-ng VM
  # (KVM) with an ext4 disk. 5.15 lacks SUBMIT_ALL (5.18), so io_uring is
  # refused there and the synchronous tier must carry everything; 6.1 has
  # both ring flavours (without NO_SQARRAY, 6.6); 6.6 has everything.
  kernels:
    name: Kernel ${{ matrix.kernel }} (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 5.15.3, the 5.15 floor, has no published build; a late 5.15 LTS
          # point release stands for the line (neither has SUBMIT_ALL).
          - kernel: v5.15.150
            uring: 0
          - kernel: v6.1
            uring: 1
          - kernel: v6.6
            uring: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install virtme-ng
        run: |
          bash dev/tools/apt-install.sh --update qemu-system-x86 virtiofsd udev busybox-static
          pipx install virtme-ng
      - name: Build the tests on the host
        run: |
          cargo test --test conformance --test native --no-run
          cargo test -p store-io-posix --lib --tests --no-run
      - name: Run them on ${{ matrix.kernel }}
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 4G "$RUNNER_TEMP/disk.img"
          # The guest's root is read-only: the checkout and the toolchain are
          # writable there through overlays (nothing reaches the host).
          vng -r ${{ matrix.kernel }} --user root --memory 4G --cpus 2 -D "$RUNNER_TEMP/disk.img" \
            --overlay-rwdir "$PWD" --overlay-rwdir "$HOME/.cargo" --overlay-rwdir "$HOME/.rustup" \
            -- bash "$PWD/dev/tools/kernel-check.sh" "$PWD" "$HOME" ${{ matrix.uring }} 4294967296 \
            2>&1 | tee "$RUNNER_TEMP/vm.log"
          grep -q ": all passed" "$RUNNER_TEMP/vm.log"

  # Crash states on a real kernel (D-079): the file system sits on a
  # dm-log-writes target that logs a FUA write when it completes, any other
  # write at the next flush, every flush, and the test's marks at once; the
  # store is then rebuilt as it stood after every logged entry from its
  # creation on, and every acknowledgement passed by then must hold
  # (tests/crash.rs).
  crash-replay:
    name: Crash replay (dm-log-writes, ${{ matrix.fs }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, xfs]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test
        run: cargo test --test crash --no-run
      - name: Log a store workload
        run: |
          set -eux
          W="$RUNNER_TEMP"
          if [ "${{ matrix.fs }}" = xfs ]; then
            bash dev/tools/apt-install.sh --update xfsprogs
          fi
          sudo modprobe dm-log-writes || {
            bash dev/tools/apt-install.sh --update "linux-modules-extra-$(uname -r)"
            sudo modprobe dm-log-writes
          }
          # mkfs.xfs refuses file systems under 300 MB.
          truncate -s 512M "$W/data.img"
          truncate -s 2G "$W/log.img"
          DATA=$(sudo losetup --show -f "$W/data.img")
          LOG=$(sudo losetup --show -f "$W/log.img")
          SECTORS=$(sudo blockdev --getsz "$DATA")
          echo "0 $SECTORS log-writes $DATA $LOG" | sudo dmsetup create lw
          # No discard of the whole device at mkfs (a huge first entry).
          if [ "${{ matrix.fs }}" = xfs ]; then
            sudo mkfs.xfs -q -K /dev/mapper/lw
          else
            sudo mkfs.ext4 -q -b 4096 -E nodiscard /dev/mapper/lw
          fi
          sudo mkdir -p /mnt/crash
          sudo mount /dev/mapper/lw /mnt/crash
          sudo chown "$(id -u):$(id -g)" /mnt/crash
          uname -r
          findmnt -no SOURCE,FSTYPE,OPTIONS /mnt/crash
          STORE_IO_CRASH_DIR=/mnt/crash STORE_IO_CRASH_ACKS="$W/acks" STORE_IO_CRASH_DM=lw \
            cargo test --test crash -- --ignored --exact crash_phase_write --nocapture
          for _ in $(seq 1 100); do sudo umount /mnt/crash && break; sleep 0.1; done
          sudo dmsetup remove lw
          sudo losetup -d "$DATA" "$LOG"
      - name: Replay every crash state and check every acknowledgement
        run: |
          W="$RUNNER_TEMP"
          STORE_IO_CRASH_LOG="$W/log.img" \
          STORE_IO_CRASH_SIZE="$(stat -c %s "$W/data.img")" \
          STORE_IO_CRASH_ACKS="$W/acks" \
          STORE_IO_CRASH_MNT=/mnt/crash \
          STORE_IO_CRASH_WORK="$W" \
          STORE_IO_CRASH_FS="${{ matrix.fs }}" \
            cargo test --test crash -- --ignored --exact crash_phase_replay --nocapture
      - name: Subsets of the writes cached before each flush (SIM-05)
        run: |
          W="$RUNNER_TEMP"
          STORE_IO_CRASH_LOG="$W/log.img" \
          STORE_IO_CRASH_SIZE="$(stat -c %s "$W/data.img")" \
          STORE_IO_CRASH_ACKS="$W/acks" \
          STORE_IO_CRASH_MNT=/mnt/crash \
          STORE_IO_CRASH_WORK="$W" \
          STORE_IO_CRASH_FS="${{ matrix.fs }}" \
          STORE_IO_CRASH_SUBSETS=64 \
            cargo test --test crash -- --ignored --exact crash_phase_subsets --nocapture
      - name: Keep the evidence of a failed crash check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.fs }}
          path: |
            ${{ runner.temp }}/log.img
            ${{ runner.temp }}/acks
            ${{ runner.temp }}/state-*.img
            ${{ runner.temp }}/subset.img
          if-no-files-found: ignore

  # The performance gates on the CI kernel (D-066: relative, under an
  # override: the runner is a virtual machine, and null_blk is classed as
  # memory): the harness's `gates` on ext4 over a memory-backed device with
  # a write-back cache (null_blk, or a loop device on tmpfs: flushes are
  # issued and cost nothing, so the microsecond gates are resolvable),
  # against fio on the same file system. Fails on any FAIL
  # verdict, anomaly or integrity failure; the report is kept either way.
  gates:
    name: Performance gates (memory-backed device, io_uring)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness
      - name: Build the harness
        run: cargo build --release --manifest-path harness/Cargo.toml
      - name: A memory-backed device with a write-back cache
        run: |
          set -eux
          bash dev/tools/apt-install.sh --update fio
          # null_blk (memory-backed, volatile cache) where the kernel ships
          # it; the runner's Azure kernel does not, so else a loop device
          # over a file on tmpfs: memory-backed too, and flush-required
          # (loop reports a write-back cache when its backing file can be
          # fsynced), with flushes that cost nothing.
          if sudo modprobe null_blk nr_devices=1 gb=6 bs=4096 memory_backed=1 cache_size=1024 queue_mode=2 irqmode=0 completion_nsec=0; then
            DEV=/dev/nullb0
          else
            sudo truncate -s 6G /dev/shm/gates.img
            DEV=$(sudo losetup --show -f -b 4096 /dev/shm/gates.img)
          fi
          Q=/sys/block/$(basename "$DEV")/queue/write_cache
          cat "$Q"
          grep -qx "write back" "$Q"
          # 6 GiB: caller-batch points hold two regions of up to 2 GiB at
          # once; no reserve, and no lazy init writing during measurements.
          sudo mkfs.ext4 -q -m 0 -b 4096 -E lazy_itable_init=0,lazy_journal_init=0 "$DEV"
          sudo mkdir -p /mnt/gates
          sudo mount "$DEV" /mnt/gates
          sudo chown "$(id -u):$(id -g)" /mnt/gates
          uname -r
          findmnt -no SOURCE,FSTYPE,OPTIONS /mnt/gates
          df -h /dev/shm /mnt/gates
      - name: Gates
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/gates"
          # --settle 0: a memory-backed device has no recovery to wait for.
          harness/target/release/store-io-harness gates --secs 3 --tier uring \
            --settle 0 --dir /mnt/gates --out "$RUNNER_TEMP/gates"
          f=$(ls "$RUNNER_TEMP"/gates/*-gates.md)
          sed -n '/^| gate |/,/^$/p' "$f"
          grep -q "every measurement completed and every integrity check passed" "$f"
          if grep -E '^\| G[0-9a-z]+ \|.*\| FAIL \|$' "$f"; then exit 1; fi
          # A gate that never ran leaves no row: G20 (the read stream) must have one.
          grep -qE '^\| G20 \|' "$f" || { echo "G20 did not run"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gates-report
          path: ${{ runner.temp }}/gates/
          if-no-files-found: ignore

  # Stores on several devices (PLANNING R5.14): four null_blk devices, each
  # memory-backed with a volatile write cache (so a flush is real) and about
  # 20 us per I/O, ext4 on each with one store: the root crate's
  # tests/multi_dev.rs (set barriers, a pointer across devices, ditto,
  # concurrent callers) and the harness's multi-device gates (G17, G18). Fails,
  # never falls back, if the devices cannot be made.
  multi-device:
    name: Multi-device (four null_blk devices)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            harness
      - name: Build the harness and the tests
        run: |
          cargo build --release --manifest-path harness/Cargo.toml
          cargo test --release --test multi_dev --no-run
      - name: Four devices
        run: |
          set -eux
          NULLB="nr_devices=4 gb=2 bs=4096 memory_backed=1 cache_size=1024 queue_mode=2 irqmode=2 completion_nsec=20000"
          # null_blk itself, from the kernel's extra modules if it is not
          # built in: never another kind of device.
          if ! sudo modprobe null_blk $NULLB; then
            bash dev/tools/apt-install.sh --update "linux-modules-extra-$(uname -r)"
            sudo modprobe null_blk $NULLB
          fi
          for i in 0 1 2 3; do
            grep -qx "write back" /sys/block/nullb$i/queue/write_cache
            sudo mkfs.ext4 -q -m 0 -b 4096 -E lazy_itable_init=0,lazy_journal_init=0 /dev/nullb$i
            sudo mkdir -p /mnt/d$i
            sudo mount /dev/nullb$i /mnt/d$i
            sudo chown "$(id -u):$(id -g)" /mnt/d$i
          done
          uname -r
          for i in 0 1 2 3; do findmnt -no SOURCE,FSTYPE,OPTIONS /mnt/d$i; done
      - name: The multi-device tests
        env:
          STORE_IO_MULTI_DEV: /mnt/d0,/mnt/d1,/mnt/d2,/mnt/d3
          STORE_IO_EXPECT_MULTI_DEV: "1"
        run: cargo test --release --test multi_dev
      - name: G17 and G18
        run: |
          set -eux
          # fio, G17's reference.
          bash dev/tools/apt-install.sh --update fio
          mkdir -p "$RUNNER_TEMP/multi"
          harness/target/release/store-io-harness multi-gates --secs 1 --settle 0 --tier uring \
            --dir /mnt/d0 --devices /mnt/d0,/mnt/d1,/mnt/d2,/mnt/d3 --out "$RUNNER_TEMP/multi"
          f=$(ls "$RUNNER_TEMP"/multi/*-multi-gates.md)
          sed -n '/^| gate |/,/^$/p' "$f"
          grep -q "every measurement completed and every integrity check passed" "$f"
          if grep -E '^\| G[0-9a-z]+ \|.*\| FAIL \|$' "$f"; then exit 1; fi
          # G17 and G18 must have run: a NOT RUN or missing row fails the job.
          grep -qE '^\| G17 \|.*\| (PASS|NOT RESOLVABLE) \|$' "$f"
          grep -qE '^\| G18 \|.*\| (PASS|NOT RESOLVABLE) \|$' "$f"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-device-report
          path: ${{ runner.temp }}/multi/
          if-no-files-found: ignore

  # G19 (PLANNING R5.14 as D-157 amends it): a commit's latency beside one
  # background Submitter, on a device calibrated to separate the paced
  # shape from a deeper one: null_blk at depth 1 behind a FIFO
  # mq-deadline, dm-delay holding flushes (harness/scripts/g19_device.sh,
  # which fails if no N separates them). Then, each leg on its own runner
  # and device: G19, paced and with pacing off (its negative control); its
  # variants G19s (sporadic commits under a CommitHold), G19b (a background
  # barrier every 8 MiB) and G19l (a long loaded round). Fails unless each
  # of the leg's gated rows is a PASS (and the main leg's G19t, auto-tuning
  # published, is REPORTED); fails, never falls back, if the device cannot
  # be made.
  g19:
    name: G19 (calibrated device, ${{ matrix.part }})
    runs-on: ubuntu-latest
    # The harness's watchdog stops a hung run after about 41 minutes.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main
            gates: G19
          - part: variants
            gates: G19s G19b G19l
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness
      - name: Build the harness
        run: cargo build --release --manifest-path harness/Cargo.toml
      - name: Tools and modules
        run: |
          bash dev/tools/apt-install.sh --update fio jq
          if ! sudo modprobe null_blk nr_devices=0 || ! sudo modprobe dm-delay; then
            bash dev/tools/apt-install.sh "linux-modules-extra-$(uname -r)"
            sudo modprobe null_blk nr_devices=0
            sudo modprobe dm-delay
          fi
      - name: Calibrate the device
        run: |
          sudo -E bash harness/scripts/g19_device.sh --out "$RUNNER_TEMP/g19" --mount /mnt/g19
          cat "$RUNNER_TEMP/g19/g19_device.md"
      - name: G19
        run: |
          set -eux
          . "$RUNNER_TEMP/g19/g19_device.env"
          mkdir -p "$RUNNER_TEMP/g19r"
          # --dir: the probe (the options and the report's device) on
          # G19's device, as G18's job does on its own.
          harness/target/release/store-io-harness g19 --dir "$G19_MOUNT" --g19-dir "$G19_MOUNT" \
            --g19-part ${{ matrix.part }} --g19-ref-mbps "$G19_REF_MBPS" --secs 4 --settle 0 \
            --out "$RUNNER_TEMP/g19r"
          f=$(ls "$RUNNER_TEMP"/g19r/*-g19.md)
          sed -n '/^| gate |/,/^$/p' "$f"
          grep -q "every measurement completed and every integrity check passed" "$f"
          # Each of the leg's gates must have run and passed: NOT RUN, FAIL
          # or a missing row fails the job.
          for g in ${{ matrix.gates }}; do grep -qE "^\\| $g \\|.*\\| PASS \\|\$" "$f"; done
          # Auto-tuning's run, published: it must have run.
          if [ "${{ matrix.part }}" = main ]; then grep -qE '^\| G19t \|.*\| REPORTED \|$' "$f"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g19-report-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/g19/
            ${{ runner.temp }}/g19r/
          if-no-files-found: ignore

  # Fail-stop on a real kernel: the file system sits on a device-mapper
  # target that is switched, mid-run, to fail every I/O. No write may
  # succeed after the first failure, and every acknowledged record must
  # survive once the device is healed (tests/dm.rs).
  dm-error:
    name: Fail-stop under device errors (dm-error)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test
        run: cargo test --test dm --no-run
      - name: Write until the device fails, heal it, verify
        run: |
          set -eux
          ACKS="$RUNNER_TEMP/acks"
          truncate -s 2G "$RUNNER_TEMP/dm.img"
          LOOP=$(sudo losetup --show -f "$RUNNER_TEMP/dm.img")
          SECTORS=$(sudo blockdev --getsz "$LOOP")
          echo "0 $SECTORS linear $LOOP 0" | sudo dmsetup create sio
          sudo mkfs.ext4 -q /dev/mapper/sio
          sudo mkdir -p /mnt/dm
          sudo mount /dev/mapper/sio /mnt/dm
          sudo chown "$(id -u):$(id -g)" /mnt/dm
          export STORE_IO_DM_DIR=/mnt/dm STORE_IO_DM_ACKS="$ACKS"
          cargo test --test dm -- --ignored --exact dm_phase_write --nocapture &
          WRITER=$!
          # Let records be acknowledged, then make every I/O fail.
          for _ in $(seq 1 240); do
            if [ -f "$ACKS" ] && [ "$(wc -l < "$ACKS")" -ge 200 ]; then break; fi
            sleep 0.5
          done
          echo "0 $SECTORS error" | sudo dmsetup load sio
          sudo dmsetup suspend --nolockfs --noflush sio
          sudo dmsetup resume sio
          wait "$WRITER"
          # Heal the device, check the file system, remount, verify.
          echo "0 $SECTORS linear $LOOP 0" | sudo dmsetup load sio
          sudo dmsetup suspend --nolockfs --noflush sio
          sudo dmsetup resume sio
          sudo umount -l /mnt/dm || true
          sudo e2fsck -fy /dev/mapper/sio || true
          sudo mount /dev/mapper/sio /mnt/dm
          cargo test --test dm -- --ignored --exact dm_phase_verify --nocapture

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # No cache: cargo extracts the overlay crates into the registry cache
      # by name and version, and a cached extract of an unchanged version
      # would hide new code.
      # Every crate, in dependency order: sibling crates resolve from a local
      # overlay until they are on crates.io.
      - name: Package (dry run)
        run: cargo package --workspace --locked

  security:
    name: Security (audit + deny + vet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-vet
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
      - name: Vet
        run: cargo vet --locked

  fuzz:
    name: Fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # A fixed nightly, so a toolchain change never decides a fuzz run.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-28
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run every target from its seed corpus
        working-directory: fuzz
        run: |
          for t in slot_validate pair_torn_update meta_decode meta2_decode judge table_decode export_info probe_linux probe_windows; do
            mkdir -p "corpus/$t"
            # The prebuilt cargo-fuzz is a musl binary and defaults to its own target.
            cargo +nightly-2026-09-28 fuzz run --target x86_64-unknown-linux-gnu "$t" "corpus/$t" -- -max_total_time=60
          done
      # A crash found here must be reproducible: keep the failing input.
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
