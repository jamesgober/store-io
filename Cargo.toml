# =============================================================================
#  R E P S   ·   store-io
# =============================================================================
[package]
name    = "store-io"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV). Provisional for the scaffold; the
# Phase 0 crate survey (io-uring, rustix, windows-sys) confirms or raises it,
# and any change is recorded in dev/ROADMAP.md before it lands.
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description (crates.io card limit is 140 characters)
description = "Durable storage I/O for Rust databases: evidence-based durability classes, unforgeable receipts, direct I/O, io_uring and IOCP."

# Keywords (5 max)
keywords = ["storage", "durability", "direct-io", "io-uring", "database"]

# Categories
categories = ["filesystem", "database-implementations", "hardware-support", "os"]

# Links
homepage      = "https://github.com/jamesgober/store-io"
repository    = "https://github.com/jamesgober/store-io"
documentation = "https://docs.rs/store-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

# Only the library sources and the documents a crate consumer needs are
# packaged. Development notes, CI and benchmarks stay in the repository.
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "store_io"
path = "src/lib.rs"

# The `store-io` command-line tool (`store-io probe <dir>`, `store-io info
# <store>`). Off by default so libraries depending on store-io build no
# binary.
[[bin]]
name = "store-io"
path = "src/bin/store-io.rs"
required-features = ["cli"]

# FEATURE FLAGS
# #################################
[features]
default = []
# Builds the `store-io` binary.
cli = []

# DEPENDENCIES
# #################################
# Only store-io's own crates: the engine and its types, and the native
# backend for this operating system. Every third-party dependency is
# justified in the crate that adds it.
[dependencies]
store-io-core     = { path = "crates/store-io-core", version = "0.1.0" }
store-io-platform = { path = "crates/store-io-platform", version = "0.1.0" }
store-io-engine   = { path = "crates/store-io-engine", version = "0.1.0" }

# The native backend: one per operating system.
[target.'cfg(windows)'.dependencies]
store-io-win = { path = "crates/store-io-win", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
store-io-posix = { path = "crates/store-io-posix", version = "0.1.0" }


# WORKSPACE
# #################################
# The facade crate is the workspace root. Backend, simulator, conformance and
# harness crates join as members under crates/ once the architecture is
# approved (dev/ROADMAP.md, phase 1).
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0 OR MIT"
authors      = ["James Gober <me@jamesgober.com>"]
repository   = "https://github.com/jamesgober/store-io"
homepage     = "https://github.com/jamesgober/store-io"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs           = "deny"
unused_must_use        = "deny"
unused_results         = "deny"
unexpected_cfgs        = { level = "deny", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
unwrap_used                 = "deny"
expect_used                 = "deny"
todo                        = "deny"
unimplemented               = "deny"
print_stdout                = "deny"
print_stderr                = "deny"
dbg_macro                   = "deny"
unreachable                 = "deny"
undocumented_unsafe_blocks  = "deny"
missing_safety_doc          = "deny"


# PROFILES
# #################################
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
