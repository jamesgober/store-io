# =============================================================================
#  R E P S   ·   store-io-posix
# =============================================================================
[package]
name          = "store-io-posix"
description   = "POSIX backends for store-io. Linux: io_uring through its own binding (never on io-wq) or synchronous system calls, direct I/O, OFD locks, fallocate, FIEMAP, cachestat and the sysfs, procfs and NVMe evidence probe. macOS: synchronous system calls on a thread pool, F_FULLFSYNC, F_NOCACHE, OFD or flock locks, F_PREALLOCATE and F_PUNCHHOLE."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/store-io-posix"
readme        = "README.md"
keywords      = ["storage", "linux", "macos", "durability", "fsync"]
categories    = ["filesystem", "os::linux-apis", "os::macos-apis"]

# Documented on the platforms where its types exist.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets        = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[lints]
workspace = true

# Every dependency is for Linux and macOS: on other targets the crate is an
# empty shell so a workspace build never fails on a foreign platform.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
store-io-core     = { path = "../store-io-core", version = "0.4.1" }
store-io-buf      = { path = "../store-io-buf", version = "0.4.1" }
store-io-platform = { path = "../store-io-platform", version = "0.4.1" }

# The Linux ABI: open flags, openat2 resolve flags, fallocate modes, OFD lock
# commands, pwritev2/preadv2, fstatfs, uname and the ioctl entry point. The
# structures libc does not expose (statx with its direct-I/O and atomic-write
# fields, FIEMAP, cachestat, the NVMe admin command) are declared in sys.rs.
libc = { version = "0.2.190", default-features = false }

# Model checker, compiled only with RUSTFLAGS="--cfg loom" (never in a normal
# build), for the submit pool's job queue and inbox handoffs.
[target.'cfg(all(loom, any(target_os = "linux", target_os = "macos")))'.dependencies]
loom = "0.7"
