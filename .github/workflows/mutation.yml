# Mutation check (Directives section 4.7, D-086): every listed mutation of a
# flush, barrier, poison, directory-sync, accounting or buffer-ownership site
# must be killed by the engine and simulator tests (the Linux backend's own
# tests for its entries; the macOS and Windows backends' own tests for theirs,
# on those systems). Runs when that code or the list changes,
# and on demand.
name: Mutation

on:
  push:
    branches: [main, dev]
    paths:
      - "crates/store-io-engine/**"
      - "crates/store-io-sim/**"
      - "crates/store-io-format/**"
      - "crates/store-io-core/**"
      - "crates/store-io-platform/**"
      - "crates/store-io-posix/**"
      - "crates/store-io-win/**"
      - "crates/store-io-conformance/**"
      - "tests/conformance.rs"
      - "crates/store-io-buf/**"
      - "dev/tools/mutate.py"
      - ".github/workflows/mutation.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "crates/store-io-engine/**"
      - "crates/store-io-sim/**"
      - "crates/store-io-format/**"
      - "crates/store-io-core/**"
      - "crates/store-io-platform/**"
      - "crates/store-io-posix/**"
      - "crates/store-io-win/**"
      - "crates/store-io-conformance/**"
      - "tests/conformance.rs"
      - "crates/store-io-buf/**"
      - "dev/tools/mutate.py"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch supersedes a run still going (it checks
# everything the older one would).
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation check (engine and simulator, shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # The whole list takes about five hours on one runner: `total` shards of
    # every `total`-th entry, each well inside the limit (`shard` lists
    # 0 to total - 1).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        total: [4]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One shard saves the cache the others restore.
          save-if: ${{ matrix.shard == 0 }}
      - name: Build the tests once
        run: cargo test -q -p store-io-engine -p store-io-sim -p store-io-posix --no-run
      - name: Every mutation is killed
        run: python3 dev/tools/mutate.py --shard ${{ matrix.shard }}/${{ matrix.total }}

  mutation-platform:
    # The entries only one system can run: the macOS and Windows backends'
    # (the Linux shards skip them; `--only-platform` runs just these).
    name: Mutation check (${{ matrix.os }} backend)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built once before the first mutant, so no mutant starts from a cold
      # build (a build that times out is an invalid mutant).
      - name: Build the tests once
        run: >-
          cargo test -q --no-run
          ${{ runner.os == 'Windows' && '-p store-io-win' || '-p store-io-posix -p store-io' }}
      - name: Every mutation is killed
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} dev/tools/mutate.py --only-platform
