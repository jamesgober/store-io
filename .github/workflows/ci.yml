name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    # rust-toolchain.toml pins `stable` for local dev; this overrides it per-job
    # so the matrix exercises both stable and the 1.85 MSRV.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The Linux backend tests run on the runner's own filesystem; record its
      # kernel and mount options so every result can be read against them.
      - name: Storage facts (Linux)
        if: runner.os == 'Linux'
        run: |
          uname -r
          findmnt -no SOURCE,FSTYPE,OPTIONS --target "$HOME"
          for f in /proc/fs/ext4/*/options; do echo "== $f"; paste -sd, "$f"; done
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (all features)
        run: cargo test --workspace --all-features
      - name: Doc (all features)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Exhaustive interleaving checks of the lock-free code: the buffer pool's
  # free lists, the append frontier, the flush domain and the region gate;
  # and of the Linux submit pool's job queue and inbox handoffs.
  loom:
    name: Loom (model checking)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg loom"
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: Loom models
        run: cargo test -p store-io-buf -p store-io-engine -p store-io-posix --lib --release loom

  # Undefined-behaviour checks of the unsafe buffer code (arena, pool,
  # lock-free queue, secure wipe) under Miri.
  miri:
    name: Miri (buffers)
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins stable for local work; Miri needs nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri
        run: cargo miri test -p store-io-buf
      - name: Miri (io_uring ring indices, simulated kernel)
        run: cargo miri test -p store-io-posix --lib uring::sys::fake

  # The conformance suite and the end-to-end tests on real Linux file
  # systems with barriers on. The runner's own root is mounted `nobarrier`
  # (store-io classes it unsafe), so each file system is a loop-mounted
  # image. The image's backing file still lives on that root, so these runs
  # check behaviour, not power-loss durability.
  conformance-linux:
    name: Conformance (${{ matrix.fs }} image)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, xfs]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mount a ${{ matrix.fs }} image
        run: |
          if [ "${{ matrix.fs }}" = xfs ]; then sudo apt-get install -y -qq xfsprogs; fi
          truncate -s 4G "$RUNNER_TEMP/fs.img"
          sudo mkfs.${{ matrix.fs }} -q "$RUNNER_TEMP/fs.img"
          sudo mkdir -p /mnt/sio
          sudo mount -o loop "$RUNNER_TEMP/fs.img" /mnt/sio
          sudo chown "$(id -u):$(id -g)" /mnt/sio
          findmnt -no SOURCE,FSTYPE,OPTIONS /mnt/sio
      - name: Conformance and end-to-end tests
        run: cargo test --test conformance --test native -- --nocapture
        env:
          STORE_IO_TEST_DIR: /mnt/sio
          STORE_IO_EXPECT_URING: "1"
      # v0.4 exit criteria on this kernel and file system: an idle store is
      # silent (60 s, both tiers), and nothing runs on io_uring's io-wq
      # workers (fails closed: a positive control must see them, and every
      # store-io point must run on io_uring), with fallbacks counted.
      - name: Idle store is silent (60 s per tier)
        run: |
          uname -r; findmnt -no FSTYPE /mnt/sio
          cargo test --test idle -- --ignored --test-threads=1 --nocapture
        env:
          STORE_IO_TEST_DIR: /mnt/sio
          STORE_IO_EXPECT_URING: "1"
      - name: No io-wq workers (W6 on io_uring), fallbacks counted
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fio
          (cd harness && cargo build --release)
          echo "kernel $(uname -r), fs $(findmnt -no FSTYPE /mnt/sio)"
          bash dev/tools/iowq-gate.sh
        env:
          STORE_IO_TEST_DIR: /mnt/sio

  # Crash states on a real kernel (D-079): the file system sits on a
  # dm-log-writes target that logs a FUA write when it completes, any other
  # write at the next flush, every flush, and the test's marks at once; the
  # store is then rebuilt as it stood after every logged entry from its
  # creation on, and every acknowledgement passed by then must hold
  # (tests/crash.rs).
  crash-replay:
    name: Crash replay (dm-log-writes, ${{ matrix.fs }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, xfs]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test
        run: cargo test --test crash --no-run
      - name: Log a store workload
        run: |
          set -eux
          W="$RUNNER_TEMP"
          if [ "${{ matrix.fs }}" = xfs ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xfsprogs
          fi
          sudo modprobe dm-log-writes || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe dm-log-writes
          }
          # mkfs.xfs refuses file systems under 300 MB.
          truncate -s 512M "$W/data.img"
          truncate -s 2G "$W/log.img"
          DATA=$(sudo losetup --show -f "$W/data.img")
          LOG=$(sudo losetup --show -f "$W/log.img")
          SECTORS=$(sudo blockdev --getsz "$DATA")
          echo "0 $SECTORS log-writes $DATA $LOG" | sudo dmsetup create lw
          # No discard of the whole device at mkfs (a huge first entry).
          if [ "${{ matrix.fs }}" = xfs ]; then
            sudo mkfs.xfs -q -K /dev/mapper/lw
          else
            sudo mkfs.ext4 -q -b 4096 -E nodiscard /dev/mapper/lw
          fi
          sudo mkdir -p /mnt/crash
          sudo mount /dev/mapper/lw /mnt/crash
          sudo chown "$(id -u):$(id -g)" /mnt/crash
          uname -r
          findmnt -no SOURCE,FSTYPE,OPTIONS /mnt/crash
          STORE_IO_CRASH_DIR=/mnt/crash STORE_IO_CRASH_ACKS="$W/acks" STORE_IO_CRASH_DM=lw \
            cargo test --test crash -- --ignored --exact crash_phase_write --nocapture
          for _ in $(seq 1 100); do sudo umount /mnt/crash && break; sleep 0.1; done
          sudo dmsetup remove lw
          sudo losetup -d "$DATA" "$LOG"
      - name: Replay every crash state and check every acknowledgement
        run: |
          W="$RUNNER_TEMP"
          STORE_IO_CRASH_LOG="$W/log.img" \
          STORE_IO_CRASH_SIZE="$(stat -c %s "$W/data.img")" \
          STORE_IO_CRASH_ACKS="$W/acks" \
          STORE_IO_CRASH_MNT=/mnt/crash \
          STORE_IO_CRASH_WORK="$W" \
          STORE_IO_CRASH_FS="${{ matrix.fs }}" \
            cargo test --test crash -- --ignored --exact crash_phase_replay --nocapture

  # Fail-stop on a real kernel: the file system sits on a device-mapper
  # target that is switched, mid-run, to fail every I/O. No write may
  # succeed after the first failure, and every acknowledged record must
  # survive once the device is healed (tests/dm.rs).
  dm-error:
    name: Fail-stop under device errors (dm-error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test
        run: cargo test --test dm --no-run
      - name: Write until the device fails, heal it, verify
        run: |
          set -eux
          ACKS="$RUNNER_TEMP/acks"
          truncate -s 2G "$RUNNER_TEMP/dm.img"
          LOOP=$(sudo losetup --show -f "$RUNNER_TEMP/dm.img")
          SECTORS=$(sudo blockdev --getsz "$LOOP")
          echo "0 $SECTORS linear $LOOP 0" | sudo dmsetup create sio
          sudo mkfs.ext4 -q /dev/mapper/sio
          sudo mkdir -p /mnt/dm
          sudo mount /dev/mapper/sio /mnt/dm
          sudo chown "$(id -u):$(id -g)" /mnt/dm
          export STORE_IO_DM_DIR=/mnt/dm STORE_IO_DM_ACKS="$ACKS"
          cargo test --test dm -- --ignored --exact dm_phase_write --nocapture &
          WRITER=$!
          # Let records be acknowledged, then make every I/O fail.
          for _ in $(seq 1 240); do
            if [ -f "$ACKS" ] && [ "$(wc -l < "$ACKS")" -ge 200 ]; then break; fi
            sleep 0.5
          done
          echo "0 $SECTORS error" | sudo dmsetup load sio
          sudo dmsetup suspend --nolockfs --noflush sio
          sudo dmsetup resume sio
          wait "$WRITER"
          # Heal the device, check the file system, remount, verify.
          echo "0 $SECTORS linear $LOOP 0" | sudo dmsetup load sio
          sudo dmsetup suspend --nolockfs --noflush sio
          sudo dmsetup resume sio
          sudo umount -l /mnt/dm || true
          sudo e2fsck -fy /dev/mapper/sio || true
          sudo mount /dev/mapper/sio /mnt/dm
          cargo test --test dm -- --ignored --exact dm_phase_verify --nocapture

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # No cache: cargo extracts the overlay crates into the registry cache
      # by name and version, and a cached extract of an unchanged version
      # would hide new code.
      # Every crate, in dependency order: sibling crates resolve from a local
      # overlay until they are on crates.io.
      - name: Package (dry run)
        run: cargo package --workspace --locked

  security:
    name: Security (audit + deny + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-vet
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
      - name: Vet
        run: cargo vet --locked

  fuzz:
    name: Fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A fixed nightly, so a toolchain change never decides a fuzz run.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-28
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run every target from its seed corpus
        working-directory: fuzz
        run: |
          for t in slot_validate pair_torn_update meta_decode table_decode probe_linux probe_windows; do
            mkdir -p "corpus/$t"
            # The prebuilt cargo-fuzz is a musl binary and defaults to its own target.
            cargo +nightly-2026-09-28 fuzz run --target x86_64-unknown-linux-gnu "$t" "corpus/$t" -- -max_total_time=60
          done
      # A crash found here must be reproducible: keep the failing input.
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
